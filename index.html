<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Beautiful Parisienne 💖</title>

<style>
  body {
    margin: 0;
    font-family: Arial;
    text-align: center;
    transition: 1s;
    background: linear-gradient(135deg, #ff4d6d, #ffb3c1);
    color: white;
  }

  .card {
    margin-top: 120px;
    padding: 30px;
    display: inline-block;
    border-radius: 25px;
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(8px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    cursor: pointer;
  }

  h1 {
    margin: 0;
    font-size: 30px;
  }

  .question {
    display: none;
    margin-top: 40px;
  }

  button {
    padding: 15px 30px;
    margin: 10px;
    border: none;
    border-radius: 20px;
    font-size: 18px;
    cursor: pointer;
    transition: 0.3s;
  }

  #yes {
    background: #00c853;
    color: white;
  }

  #no {
    background: #d50000;
    color: white;
  }

  #messageFinal {
    display: none;
    font-size: 22px;
    margin-top: 50px;
  }

</style>
</head>

<body>

<!-- PREMIER ÉCRAN -->
<div class="card" id="intro" onclick="openCard()">
  <h1>Bonjour beautiful Parisienne 💖</h1>
  <p>(clique ici)</p>
</div>

<!-- QUESTION -->
<div class="question" id="question">
  <h2>Do you love me ? 💌</h2>
  <button id="yes" onclick="yesClick()">Yes</button>
  <button id="no" onclick="noClick()">No</button>
</div>

<!-- MESSAGE FINAL -->
<div id="messageFinal">
  <h2>samahni nhbk bzef w I love you so much 💖</h2>
</div>

<script>
let yesSize = 18;

function openCard() {
  document.getElementById("intro").style.display = "none";
  document.getElementById("question").style.display = "block";
}

function noClick() {
  yesSize += 10;
  let yesBtn = document.getElementById("yes");
  yesBtn.style.fontSize = yesSize + "px";
  yesBtn.style.padding = (yesSize) + "px";

  yesBtn.innerText = "YES 😳";
}

function yesClick() {
  document.body.style.background = "url('https://i.pinimg.com/originals/3a/1f/3b/3a1f3b9c0f1e8a2b0d9d2b5c6f0e2c1d.gif')";
  document.body.style.backgroundSize = "cover";

  document.getElementById("question").style.display = "none";
  document.getElementById("messageFinal").style.display = "block";
}
</script>

</body>
</html>
