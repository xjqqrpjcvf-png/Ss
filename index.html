<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Do You Love Me?</title>
  <style>
    body {
      background-color: pink; /* Pink background */
      text-align: center;
      font-family: 'Arial', sans-serif;
      color: #333;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      height: 100vh;
    }

    #question, #options, #final-message, #meme {
      display: none; /* Hidden until triggered */
    }

    #initial-button {
      font-size: 24px;
      padding: 10px 20px;
      background-color: white;
      color: #333;
      border: 2px solid #333;
      border-radius: 10px;
      cursor: pointer;
    }

    #options button {
      font-size: 16px;
      padding: 10px 20px;
      margin: 10px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
    }

    #yes {
      background-color: lightgreen;
    }

    #no {
      background-color: lightcoral;
    }

    #final-message {
      font-size: 36px; /* Big and decorated text */
      font-weight: bold;
      color: darkred;
      background: white;
      padding: 20px;
      border-radius: 15px;
      border: 3px solid darkred;
      box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.3);
      margin-top: 20px;
    }

    img {
      width: 150px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <button id="initial-button">Hi beautiful Parisienne</button>

  <div id="question">Do you love me?</div>
  
  <div id="options">
    <button id="yes">Yes</button>
    <button id="no">No</button>
  </div>
  
  <!-- Meme/Sticker added -->
  <img id="meme" src="https://i.imgur.com/QpS7bYk.png" alt="Love Meme" />

  <div id="final-message">I love you so much, please Smhni ❤️✨💐</div>

  <script>
    const initialButton = document.getElementById('initial-button');
    const question = document.getElementById('question');
    const options = document.getElementById('options');
    const yesButton = document.getElementById('yes');
    const noButton = document.getElementById('no');
    const finalMessage = document.getElementById('final-message');
    const meme = document.getElementById('meme');

    // Step 1: Show "Do you love me?" after clicking "Hi beautiful Parisienne"
    initialButton.addEventListener('click', () => {
      initialButton.style.display = 'none'; // Hide the first button
      question.style.display = 'block'; // Display question
      options.style.display = 'block'; // Display buttons
      meme.style.display = 'block'; // Display the meme/sticker
    });

    // Step 2: Handle "No" button click (makes "Yes" button grow bigger)
    noButton.addEventListener('click', () => {
      const currentSize = parseFloat(window.getComputedStyle(yesButton).fontSize);
      yesButton.style.fontSize = (currentSize + 2) + 'px';
    });

    // Step 3: Handle "Yes" button click (shows the final message)
    yesButton.addEventListener('click', () => {
      question.style.display = 'none';
      options.style.display = 'none';
      meme.style.display = 'none';
      finalMessage.style.display = 'block'; // Show final decorated phrase
    });
  </script>
</body>
</html>
