<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>💖 Beautiful Parisienne</title>

<style>
  body {
    margin: 0;
    font-family: Arial;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    transition: 1s;
    color: white;
  }

  .card {
    background: rgba(255,255,255,0.25);
    padding: 40px;
    border-radius: 25px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    cursor: pointer;
    min-width: 300px;
  }

  h1, h2 {
    margin: 0;
  }

  button {
    padding: 15px 25px;
    margin: 10px;
    border: none;
    border-radius: 20px;
    font-size: 18px;
    cursor: pointer;
  }

  #yes {
    background: #00c853;
    color: white;
  }

  #no {
    background: #d50000;
    color: white;
  }

</style>
</head>

<body>

<div class="card" id="card">

  <h1 id="text">Bonjour beautiful Parisienne 💖</h1>
  
  <div id="step1">
    <p>(clique sur le cadre)</p>
  </div>

  <div id="step2" style="display:none;">
    <h2>Do you love me ? 💌</h2>
    <button id="yes" onclick="yes()">Yes</button>
    <button id="no" onclick="no()">No</button>
  </div>

  <div id="step3" style="display:none;">
    <h2>🦄</h2>
    <p style="font-size:22px;">
      Je suis désolé pour tout<br>
      Smhni nhbk 💖
    </p>
  </div>

</div>

<script>

let yesBtn = document.getElementById("yes");

document.getElementById("card").onclick = function() {
  document.getElementById("step1").style.display = "none";
  document.getElementById("step2").style.display = "block";
}

function no() {
  let size = parseFloat(window.getComputedStyle(yesBtn).fontSize);
  yesBtn.style.fontSize = (size + 5) + "px";
  yesBtn.innerText = "YES 😳";
}

function yes() {
  document.getElementById("step2").style.display = "none";
  document.getElementById("step3").style.display = "block";

  document.body.style.background =
    "url('https://i.pinimg.com/originals/5d/8f/7d/5d8f7d2c1a8c6d9b3a2f1e0c.gif')";
  document.body.style.backgroundSize = "cover";
}

</script>

</body>
</html>
