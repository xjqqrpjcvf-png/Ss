<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>💖 Parisienne</title>

<style>
  body {
    margin: 0;
    font-family: Arial;
    text-align: center;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    color: white;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .box {
    background: rgba(255,255,255,0.25);
    padding: 30px;
    border-radius: 25px;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    transition: 0.3s;
  }

  .box:hover {
    transform: scale(1.05);
  }

  h1, h2 {
    margin: 0;
  }

  button {
    padding: 15px 25px;
    margin: 10px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    font-size: 18px;
  }

  #yes {
    background: #00c853;
    color: white;
  }

  #no {
    background: #d50000;
    color: white;
  }

  .screen {
    display: none;
  }

  .active {
    display: block;
  }

</style>
</head>

<body>

<!-- ÉCRAN 1 -->
<div id="screen1" class="screen active">
  <div class="box" onclick="go2()">
    <h1>Bonjour beautiful Parisienne 💖</h1>
    <p>(clique ici)</p>
  </div>
</div>

<!-- ÉCRAN 2 -->
<div id="screen2" class="screen">
  <div class="box">
    <h2>Do you love me ? 💌</h2>
    <button id="yes" onclick="go3()">Yes</button>
    <button id="no" onclick="growYes()">No</button>
  </div>
</div>

<!-- ÉCRAN 3 -->
<div id="screen3" class="screen">
  <div class="box">
    <h2>🦄</h2>
    <p style="font-size:22px;">
      Je suis désolé pour tout<br>
      Smhni nhbk 💖
    </p>
  </div>
</div>

<script>
let yesSize = 18;

function go2() {
  document.getElementById("screen1").classList.remove("active");
  document.getElementById("screen2").classList.add("active");
}

function growYes() {
  yesSize += 10;
  let btn = document.getElementById("yes");
  btn.style.fontSize = yesSize + "px";
  btn.style.padding = (yesSize/2) + "px 25px";
  btn.innerText = "YES 😳";
}

function go3() {
  document.getElementById("screen2").classList.remove("active");
  document.getElementById("screen3").classList.add("active");

  document.body.style.background =
    "url('https://i.pinimg.com/originals/5d/8f/7d/5d8f7d2c1a8c6d9b3a2f1e0c.gif')";
  document.body.style.backgroundSize = "cover";
}
</script>

</body>
</html>
